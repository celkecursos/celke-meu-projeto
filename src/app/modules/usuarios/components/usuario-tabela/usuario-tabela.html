<app-tabela
  [listagem]="listagem()"
  [colunas]="colunas"
  (selecionar)="selecionar.emit($event)"
>
  <ng-template #appTabelaAcoes let-usuario>
    <div class="flex items-center justify-end gap-2">
      <button
        type="button"
        class="controle cursor-pointer rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
        [attr.aria-label]="'Detalhes de ' + usuario.nomeCompleto"
        (click)="visualizar.emit(usuario)"
      >
        Detalhes
      </button>

      <button
        type="button"
        class="controle cursor-pointer rounded-md border border-atencao-400 bg-white px-3 py-1.5 text-sm font-medium text-atencao-700 hover:bg-atencao-100 dark:border-atencao-400 dark:bg-slate-800 dark:text-atencao-400 dark:hover:bg-atencao-900"
        [attr.aria-label]="'Alterar ' + usuario.nomeCompleto"
        (click)="editar.emit(usuario)"
      >
        Alterar
      </button>

      @if (usuario.situacao === 'ativo') {
        <button
          type="button"
          class="controle cursor-pointer rounded-md border border-perigo-600 bg-white px-3 py-1.5 text-sm font-medium text-perigo-600 hover:bg-perigo-100 dark:border-perigo-500 dark:bg-slate-800 dark:text-perigo-500 dark:hover:bg-perigo-900"
          [attr.aria-label]="'Inativar ' + usuario.nomeCompleto"
          (click)="alternarSituacao.emit(usuario)"
        >
          Inativar
        </button>
      } @else {
        <button
          type="button"
          class="controle cursor-pointer rounded-md border border-marca-700 bg-white px-3 py-1.5 text-sm font-medium text-marca-700 hover:bg-marca-100 dark:border-marca-300 dark:bg-slate-800 dark:text-marca-300 dark:hover:bg-slate-700"
          [attr.aria-label]="'Reativar ' + usuario.nomeCompleto"
          (click)="alternarSituacao.emit(usuario)"
        >
          Reativar
        </button>
      }
    </div>
  </ng-template>
</app-tabela>
