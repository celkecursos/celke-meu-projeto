<!--
  Única tela do app fora do EstruturaLayout (sem nav, sem header) — por isso é a
  única com `max-w` e centralização própria: aqui não há a coluna do <main> para
  herdar, e uma tela de login ocupando a largura inteira ficaria estranha.
-->
<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 dark:bg-slate-950">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">
        celke-meu-projeto
      </h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Entre para continuar</p>
    </div>

    <div class="rounded-lg border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-900">
      @if (recusa(); as motivo) {
        <div
          class="mb-4 rounded-md border border-perigo-600 bg-perigo-100 px-4 py-3 text-sm text-perigo-900 dark:border-perigo-500 dark:bg-perigo-900 dark:text-perigo-100"
          role="alert"
        >
          {{ motivo }}
        </div>
      }

      <form [formGroup]="formulario" (ngSubmit)="submit()" class="flex flex-col gap-4">
        <app-campo-texto formControlName="email" rotulo="E-mail" tipo="email" />
        <app-campo-texto formControlName="senha" rotulo="Senha" tipo="password" />

        <button
          type="submit"
          class="controle cursor-pointer rounded-md bg-marca-600 px-4 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-marca-700 dark:bg-marca-500 dark:hover:bg-marca-600"
        >
          Entrar
        </button>
      </form>
    </div>

    <!--
      Credencial de demonstração — só existe porque o mock exige exatamente ESTA
      credencial (não "qualquer e-mail válido"); sem exibi-la, ninguém adivinha o
      que digitar. Vem de `credencialDemo` (fonte única com a facade), nunca
      digitada aqui de novo — evita os dois arquivos divergirem.
    -->
    <div class="mt-4 rounded-md border border-slate-200 bg-slate-50 px-4 py-3 text-center dark:border-slate-700 dark:bg-slate-900">
      <p class="text-xs font-medium text-slate-500 dark:text-slate-400">
        Login de demonstração — use esta credencial:
      </p>
      <p class="mt-1 text-sm text-slate-700 dark:text-slate-200">
        <span class="font-mono">{{ credencialDemo.email }}</span>
        ·
        <span class="font-mono">{{ credencialDemo.senha }}</span>
      </p>
    </div>
  </div>
</div>
